name: Compilar APK SENE VENTAS
on:
  push:
    branches: [main, sene-ventas-rebuild, fix/ventas-compile-approved-knowledge, fix/ventas-cloudflare-client]
  pull_request:
    branches: [main, sene-ventas-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Localizar Android SDK y sdkmanager
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager. Directorios SDK disponibles:"
            ls -la "$SDK_ROOT" || true
            find /usr/local/lib/android -maxdepth 4 -type d 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar plataforma y herramientas Android
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Verificar Gradle
        run: gradle --version
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Preparar APK con nombre oficial
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk 'dist/SENE VENTAS-online.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: SENE VENTAS-online
          path: 'dist/SENE VENTAS-online.apk'
          if-no-files-found: error
