name: Compilar APK SENE VENTAS-online
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Push and pull_request can target the same commit; keep only one active build
# per branch so duplicate runs do not congest Android SDK/Gradle setup.
concurrency:
  group: sene-ventas-apk-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verificar Gradle
        run: gradle --version
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Preparar APK con nombre oficial
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SENE VENTAS-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE VENTAS-online
          path: dist/SENE VENTAS-online.apk
          if-no-files-found: error