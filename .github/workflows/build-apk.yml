name: Compilar APK SENE VENTAS
on:
  push:
    branches: [main, sene-ventas-rebuild, fix/ventas-compile-approved-knowledge, work/shared-inventory-sene, work/worker-onboarding-payroll-v2, fix/no-nested-inventario-sene, ui/modern-sene-ventas, fix/payroll-attendance-sync-2026-11, feature/loan-consumption-approval-client, feature/server-sene-complete-api, review/server-sene-prices-20261122, fix/shift-navigation-pending-reports-20261123]
  pull_request:
    branches: [main, sene-ventas-rebuild, work/shared-inventory-sene]
  workflow_dispatch:
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de SERVER-SENE
        run: node --input-type=module --check < server-sene/worker.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar firma permanente (si está configurada)
        env:
          SENE_KEYSTORE_BASE64: ${{ secrets.SENE_KEYSTORE_BASE64 }}
          SENE_STORE_PASSWORD: ${{ secrets.SENE_STORE_PASSWORD }}
          SENE_KEY_ALIAS: ${{ secrets.SENE_KEY_ALIAS }}
          SENE_KEY_PASSWORD: ${{ secrets.SENE_KEY_PASSWORD }}
        run: |
          if [ -n "$SENE_KEYSTORE_BASE64" ] && [ -n "$SENE_STORE_PASSWORD" ] && [ -n "$SENE_KEY_ALIAS" ] && [ -n "$SENE_KEY_PASSWORD" ]; then
            echo "$SENE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sene-ventas-signing.jks"
            test -s "$RUNNER_TEMP/sene-ventas-signing.jks"
            chmod 600 "$RUNNER_TEMP/sene-ventas-signing.jks"
            echo "SENE_KEYSTORE_PATH=$RUNNER_TEMP/sene-ventas-signing.jks" >> "$GITHUB_ENV"
            echo "SENE_STORE_PASSWORD=$SENE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SENE_KEY_ALIAS=$SENE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SENE_KEY_PASSWORD=$SENE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SENE_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Firma permanente configurada."
          else
            echo "SENE_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::No hay firma permanente. La APK resultante es SOLO de compilación y NO debe instalarse como actualización."
          fi
      - name: Localizar Android SDK y sdkmanager
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager. Directorios SDK disponibles:"
            ls -la "$SDK_ROOT" || true
            find /usr/local/lib/android -maxdepth 4 -type d 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Instalar plataforma y herramientas Android
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Verificar Gradle
        run: gradle --version
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Verificar firma y preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SENE-VENTAS.apk
          test -s dist/SENE-VENTAS.apk
          unzip -t dist/SENE-VENTAS.apk >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/SENE-VENTAS.apk
          sha256sum dist/SENE-VENTAS.apk
          sha256sum dist/SENE-VENTAS.apk
          if [ "$SENE_STABLE_SIGNING" = "true" ]; then
            echo "APK firmada con la llave permanente configurada."
          else
            echo "::warning::APK con firma temporal de depuración; NO instalar ni distribuir."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SENE-VENTAS-${{ env.SENE_STABLE_SIGNING == 'true' && 'FIRMA-PERMANENTE' || 'NO-INSTALAR-SIN-FIRMA' }}
          path: dist/SENE-VENTAS.apk
          if-no-files-found: error
