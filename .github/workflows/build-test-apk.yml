name: Build SENE VENTAS test APK

on:
  push:
    branches:
      - integration/ventas-completa
      - integration/ack-universal
      - consolidation/ventas-unificada
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

concurrency:
  # Una rama no debe cancelar las pruebas de otra rama.
  group: sene-ventas-test-apk-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compilar APK de pruebas
        run: gradle --no-daemon assembleDebug
      - name: Localizar APK para prueba de arranque
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find "$GITHUB_WORKSPACE/app/build/outputs/apk" -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Verificar identidad y recursos del APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          grep -F "name='com.sene.ventas'" <<< "$BADGING"
          grep -F "application-label:'SENE-VENTAS'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'logo_sene_pv'
          unzip -l "$APK" | grep -q 'file_paths'
          sha256sum "$APK"
      - name: Smoke test de arranque en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -eu
            mkdir -p diagnostics
            test -n "$APK_PATH" && test -s "$APK_PATH"
            timeout 60s adb wait-for-device
            BOOTED="$(adb shell getprop sys.boot_completed | tr -d '\r')"
            if [ "$BOOTED" != "1" ]; then
              echo "El emulador no terminó de iniciar."
              adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || true
              adb shell dumpsys activity activities > diagnostics/activity.txt 2>&1 || true
              exit 1
            fi
            adb devices -l
            if ! timeout 120s adb install -r "$APK_PATH"; then
              adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || true
              exit 1
            fi
            adb shell am force-stop com.sene.ventas
            if ! timeout 45s adb shell monkey -p com.sene.ventas 1; then
              adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || true
              adb shell dumpsys activity activities > diagnostics/activity.txt 2>&1 || true
              exit 1
            fi
            attempt=0
            while [ "$attempt" -lt 20 ]; do
              if adb shell pidof com.sene.ventas >/dev/null 2>&1; then
                adb shell pidof com.sene.ventas
                exit 0
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
            echo "La aplicación no mantuvo un proceso activo tras el lanzamiento."
            adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || true
            adb shell dumpsys activity activities > diagnostics/activity.txt 2>&1 || true
            adb shell dumpsys package com.sene.ventas > diagnostics/package.txt 2>&1 || true
            echo "Smoke test de arranque fallido." > diagnostics/result.txt
            exit 1
      - name: Subir diagnóstico del smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SENE-VENTAS-smoke-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preparar nombre de entrega
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SENE VENTAS-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE VENTAS-online
          path: dist/SENE VENTAS-online.apk
          if-no-files-found: error
          retention-days: 14
