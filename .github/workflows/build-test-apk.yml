name: Build SENE VENTAS test APK

on:
  push:
    branches:
      - integration/ventas-completa
      - integration/ack-universal
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

concurrency:
  group: sene-ventas-test-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compilar APK de pruebas
        run: gradle --no-daemon assembleDebug
      - name: Verificar identidad y recursos del APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          grep -F "name='com.sene.ventas'" <<< "$BADGING"
          grep -F "application-label:'SENE-VENTAS'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'logo_sene_pv'
          unzip -l "$APK" | grep -q 'file_paths'
          sha256sum "$APK"
      - name: Smoke test de arranque en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
            echo "APK esperado: $APK"
            ls -l "$APK"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am start -n com.sene.ventas/.InicioTurnoActivity
            sleep 8
            adb shell pidof com.sene.ventas
      - name: Preparar nombre de entrega
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SENE VENTAS-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE VENTAS-online
          path: dist/SENE VENTAS-online.apk
          if-no-files-found: error
          retention-days: 14
