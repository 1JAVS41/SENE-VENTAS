name: Build SENE VENTAS test APK

on:
  push:
    branches:
      - integration/ventas-completa
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compilar APK de pruebas
        run: gradle --no-daemon assembleDebug
      - name: Preparar nombre de entrega
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SENE VENTAS-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE VENTAS-online
          path: dist/SENE VENTAS-online.apk
          if-no-files-found: error
          retention-days: 14
